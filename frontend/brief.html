<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not sure what to say? · Saccade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;700&family=Poppins:wght@600;800&family=Montserrat:wght@500;800&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap">
<style>
  /* Cherry Velvet, same as the rest of Saccade */
  :root {
    --bg: #120709; --bg-2: #2A0F14;
    --ink: #F7EEDC; --muted: #C2ACA2; --label: #F3E6BD;
    --line: rgba(255,255,255,0.16);
    --accent: #FD9BB7; --hi: #D8973C;
    --glass: linear-gradient(140deg, rgba(255,255,255,0.16), rgba(255,255,255,0.05) 60%, rgba(255,255,255,0.1));
    --serif: 'Instrument Serif', Georgia, serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink); line-height: 1.5;
    font-family: Inter, system-ui, sans-serif;
    background: radial-gradient(900px 600px at 85% -10%, rgba(173,40,49,0.45), transparent 60%),
                radial-gradient(700px 500px at -10% 40%, rgba(110,30,59,0.4), transparent 60%), var(--bg);
    background-attachment: fixed;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 16px 72px; }
  header h1 { font-size: clamp(32px, 5vw, 46px); line-height: 1.1; margin: 0 0 8px; letter-spacing: -1px; }
  header h1 em { font-family: var(--serif); font-weight: 400; color: var(--accent); }
  header p { margin: 0 0 20px; color: var(--muted); font-size: 17px; }
  .back { display: inline-block; margin-bottom: 18px; color: var(--muted); text-decoration: none; font-family: var(--mono); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
  .back:hover { color: var(--ink); }
  .progress { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin-bottom: 18px; }
  .progress > span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #AD2831, var(--accent)); transition: width 0.4s ease; }

  #log { display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 86%; padding: 11px 15px; border-radius: 18px; white-space: pre-wrap; }
  .msg.bot { background: var(--glass); border: 1px solid var(--line); border-top-left-radius: 6px; align-self: flex-start; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .msg.me { background: var(--accent); color: var(--bg); font-weight: 600; border-top-right-radius: 6px; align-self: flex-end; }
  .typing { color: var(--muted); font-style: italic; }

  #composer { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font: inherit; padding: 8px 16px; border-radius: 999px; cursor: pointer;
    border: 1.5px solid rgba(253,155,183,0.6); background: rgba(253,155,183,0.08); color: var(--accent); font-weight: 600;
  }
  .chip:hover { background: rgba(253,155,183,0.18); }
  .chip.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .chip.soft { border-color: var(--line); color: var(--ink); font-weight: 500; background: rgba(255,255,255,0.05); }
  .field { display: flex; gap: 8px; }
  .field input {
    flex: 1; font: inherit; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,0.07); color: var(--ink);
  }
  .field input::placeholder { color: var(--muted); }
  button.primary {
    font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 11px 20px;
    background: var(--accent); color: var(--bg); cursor: pointer;
  }
  button.primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .hint { font-size: 0.88rem; color: var(--muted); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* the brief */
  .brief { background: var(--glass); border: 1px solid rgba(255,255,255,0.22); border-radius: 26px; padding: 26px; margin-top: 8px; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
  .brief h2 { margin: 0 0 4px; font-size: 1.6rem; letter-spacing: -0.5px; }
  .brief h3 { margin: 24px 0 8px; font-family: var(--mono); font-size: 0.74rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--label); }
  .core { font-size: 1.5rem; font-weight: 700; line-height: 1.25; letter-spacing: -0.01em; }
  .core mark { background: var(--accent); color: var(--bg); padding: 0 6px; border-radius: 4px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .sw { width: 86px; height: 54px; border-radius: 10px; display: flex; align-items: flex-end; padding: 4px 6px; font-family: var(--mono); font-size: 0.68rem; border: 1px solid rgba(255,255,255,0.2); }
  .ideas { display: grid; gap: 10px; }
  .idea { border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; background: rgba(255,255,255,0.04); }
  .idea b { display: block; }
  .tag { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 1px 9px; border-radius: 999px; background: var(--hi); color: var(--bg); margin-left: 6px; vertical-align: 1px; }
  .tag.later { background: rgba(255,255,255,0.12); color: var(--muted); }
  .notice { font-size: 0.9rem; color: var(--muted); margin-top: 4px; }
  .brief ul { margin: 0; padding-left: 20px; }
  .brief li { margin-bottom: 4px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
  a.primary { text-decoration: none; display: inline-block; font-weight: 700; border-radius: 999px; padding: 12px 20px; background: var(--accent); color: var(--bg); }
  button.secondary { font: inherit; font-weight: 600; padding: 11px 18px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,0.06); color: var(--ink); cursor: pointer; }
  button.secondary:hover { background: rgba(255,255,255,0.12); }

  /* step-by-step questions (one per screen) */
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; min-height: 40px; }
  .backbtn { font: inherit; font-size: 16px; font-weight: 600; color: var(--ink); background: rgba(255,255,255,0.06); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; cursor: pointer; }
  .backbtn:disabled { visibility: hidden; }
  .steptxt { font-size: 15px; color: var(--muted); }
  .card { background: var(--glass); border: 1px solid rgba(255,255,255,0.22); border-radius: 28px; padding: clamp(22px, 5vw, 36px); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); animation: cardIn .35s ease both; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .card h2 { font-size: clamp(24px, 4.2vw, 32px); line-height: 1.2; letter-spacing: -0.5px; margin: 0 0 6px; }
  .card .sub { color: var(--muted); font-size: 17px; margin: 0 0 22px; }
  .note { display: inline-block; background: rgba(216,151,60,0.16); border: 1px solid rgba(216,151,60,0.45); color: #F3D8A8; border-radius: 14px; padding: 8px 14px; font-size: 15px; margin-bottom: 16px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .tile { font: inherit; font-size: 18px; font-weight: 600; text-align: left; color: var(--ink); min-height: 64px; padding: 16px 18px; border-radius: 18px; cursor: pointer;
    background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.18); display: flex; align-items: center; gap: 12px; transition: background .15s, border-color .15s, transform .1s; }
  .tile:hover { background: rgba(253,155,183,0.1); border-color: rgba(253,155,183,0.6); }
  .tile:active { transform: scale(0.98); }
  .tile .box { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.35); display: grid; place-items: center; font-size: 15px; color: var(--bg); }
  .tile.multi .box { border-radius: 8px; }
  .tile.on { background: rgba(253,155,183,0.2); border-color: var(--accent); }
  .tile.on .box { background: var(--accent); border-color: var(--accent); }
  .bigin { width: 100%; font: inherit; font-size: 20px; padding: 16px 18px; border-radius: 18px; border: 1.5px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.07); color: var(--ink); }
  .bigin:focus { border-color: var(--accent); outline: none; }
  .bigin::placeholder { color: var(--muted); }
  .starters { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; }
  .nextrow { display: flex; align-items: center; gap: 14px; margin-top: 24px; flex-wrap: wrap; }
  .nextbtn { font: inherit; font-size: 18px; font-weight: 700; border: 0; border-radius: 999px; padding: 15px 30px; background: var(--accent); color: var(--bg); cursor: pointer; }
  .nextbtn:disabled { opacity: 0.35; cursor: not-allowed; }
  .linkish { font: inherit; font-size: 16px; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 6px 0; text-decoration: underline; text-underline-offset: 3px; }
  .welcome ul { list-style: none; padding: 0; margin: 0 0 6px; display: grid; gap: 10px; font-size: 17px; }
  .welcome li::before { content: "✓"; color: var(--accent); font-weight: 800; margin-right: 10px; }
  .drafts { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
  .draft { display: flex; flex-direction: column; gap: 8px; }
  .draft canvas { width: 100%; height: auto; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.45); background: #222; }
  .draft b { font-size: 15px; }
  .draft .why { font-size: 13.5px; color: var(--muted); line-height: 1.4; }
  .draft .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .draft .btns a, .draft .btns button { font: inherit; font-size: 13px; font-weight: 700; padding: 8px 12px; border-radius: 999px; text-decoration: none; cursor: pointer; }
  .draft .btns a { background: var(--accent); color: var(--bg); border: 0; }
  .draft .btns button { background: rgba(255,255,255,0.06); color: var(--ink); border: 1px solid var(--line); }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./#try">← Back to the poster checker</a>
  <header>
    <h1>Not sure what <em>to say?</em></h1>
    <p>A few taps, about two minutes. We'll work out your message, your look and three posts you can make for free.</p>
  </header>
  <div class="topbar" id="topbar" hidden>
    <button type="button" class="backbtn" id="backBtn">← Back</button>
    <span id="stepTxt" class="steptxt"></span>
  </div>
  <div class="progress" aria-hidden="true"><span id="bar"></span></div>
  <main id="stage" aria-live="polite"></main>
  <noscript>This page needs JavaScript to run.</noscript>
</div>

<script>
/* =====================================================================
   1. PURE LOGIC (no page code here, easy to test and to change)
   ===================================================================== */
const words = s => s.trim().split(/\s+/).filter(Boolean);
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

// Guess what kind of message the owner wants to promote.
function classify(t) {
  const s = t.toLowerCase();
  if (/(\d+\s?%|\boff\b|\bsale\b|discount|\bdeal\b|£|bogof|2[- ]?for[- ]?1|voucher|half price|\bfree\b)/.test(s)) return 'offer';
  if (/(\bcall\b|\bbook\b|booking|appointment|repair|\bfix|plumb|electric|clean|haircut|barber|salon|\bmot\b|garage|lesson|tutor|therapy|massage|delivery service|hiring|we are hiring)/.test(s)) return 'service';
  if (/(night|event|party|workshop|market|launch|opening|open mic|class|festival|gig|concert|tournament|meetup|social|show|live music)/.test(s)) return 'event';
  if (/(menu|\bnew\b|flavou?r|collection|range|dish|product|batch|season|special|arrival|drink|bake|coffee|cake|hand-?made|candle|jewel|print|clothing|soap|plant)/.test(s)) return 'product';
  return 'story';
}

// "Jazz night on Friday, 2-for-1 cocktails" -> two separate messages.
// Only splits when EVERY piece has at least two words, so "pastries and coffee" stays whole.
function splitIdeas(t) {
  const parts = t.split(/\s*(?:,|;|&|\+|\band\b|\bplus\b|\/)\s*/i).map(p => p.trim()).filter(Boolean);
  const real = parts.filter(p => words(p).length >= 2);
  return (real.length >= 2 && real.length === parts.length) ? real.slice(0, 4) : [];
}

const PALETTES = {
  Cosy: ['#E8B07A', '#7A4B2A', '#FFF3E0'], Sleek: ['#111111', '#F5F5F5', '#C8A96A'],
  Playful: ['#FF5E5B', '#FFD23F', '#3BCEAC'], Serious: ['#12263A', '#FFFFFF', '#D1495B'],
  Handmade: ['#C97B4A', '#F2E3C6', '#4F6D5A'], Modern: ['#1D3557', '#F1FAEE', '#E63946'],
  Bold: ['#FF3D00', '#111111', '#FFE600'], Calm: ['#A8C3BC', '#F6F3EE', '#3D5A80'],
  Friendly: ['#FF8C42', '#FFF1D6', '#2A9D8F'], Premium: ['#1B1B1B', '#D4AF37', '#F7F1E3']
};
const FONTS = {
  Playful: 'Poppins (bold for the main message) with Nunito for small text',
  Bold: 'Poppins (bold for the main message) with Nunito for small text',
  Friendly: 'Poppins (bold for the main message) with Nunito for small text',
  Sleek: 'Montserrat or Inter, with lots of empty space',
  Modern: 'Montserrat or Inter, with lots of empty space',
  Premium: 'Montserrat or Inter, with lots of empty space',
  Cosy: 'Fraunces or Lora for the headline, Inter for small text',
  Handmade: 'Fraunces or Lora for the headline, Inter for small text',
  Serious: 'Inter or Source Serif, regular weight, generous spacing',
  Calm: 'Inter or Source Serif, regular weight, generous spacing'
};
const VOICES = {
  Playful: 'Light and a little cheeky. Use emoji sparingly.',
  Serious: 'Calm and confident. No exclamation marks.',
  Premium: 'Calm and confident. No exclamation marks.',
  Cosy: 'Warm, like talking to a regular.',
  Friendly: 'Warm, like talking to a regular.',
  Handmade: 'Warm and honest, like talking to a regular.',
  Bold: 'Short and punchy.',
  Sleek: 'Clean and direct. Fewer words.',
  Modern: 'Clean and direct. Fewer words.',
  Calm: 'Gentle and reassuring.'
};
const PHOTOS = {
  Cosy: 'warm light, close-ups of hands, steam and texture',
  Handmade: 'warm light, close-ups of hands, steam and texture',
  Sleek: 'clean backgrounds with plenty of empty space',
  Modern: 'clean backgrounds with plenty of empty space',
  Premium: 'clean backgrounds with plenty of empty space',
  Playful: 'bright, close and a bit messy is fine',
  Bold: 'bright, close and a bit messy is fine',
  Friendly: 'bright, natural, with people in the shot',
  Calm: 'soft daylight and wider shots',
  Serious: 'soft daylight, one subject, nothing in the background'
};

function ideasFor(A) {
  const when = A.when && A.when !== 'No end date' ? A.when : '';
  const type = A.offerType || 'story';
  let list;
  if (type === 'offer') list = [
    { title: 'The big number', what: `Make "${A.offer}" the biggest thing on the post, about a third of the space. Your name goes small in a corner${when ? `, with "${when.toLowerCase()}" underneath` : ''}.`, notice: 'The offer' },
    { title: 'One photo, one line', what: 'Use your best photo of what you sell and put the offer as a single short line on a calm part of the picture.', notice: 'The offer, then the photo' },
    { title: 'Last-chance reminder', what: when ? 'Post the same offer again on the last day with "ends tonight" or "last day".' : 'Repeat the offer once a week with a fresh photo, so regulars keep seeing it.', notice: when ? 'The deadline' : 'The offer' }
  ];
  else if (type === 'event') list = [
    { title: 'Date first', what: `Make the day and time the biggest text${A.when ? ` ("${A.when}")` : ''}, then the event name just below it. Add the place in smaller text.`, notice: 'The date' },
    { title: 'Behind the scenes', what: 'Post a 10-second clip or photo of you getting ready for it, with the event name as the only caption line.', notice: 'The event name' },
    { title: 'The day-before reminder', what: 'Post a simple "tomorrow" or "tonight" reminder with the same layout as your first post, so people recognise it.', notice: '"Tonight" or "Tomorrow"' }
  ];
  else if (type === 'product') list = [
    { title: 'Hero shot', what: 'One close-up photo of it on a plain background, with its name below in large text.', notice: 'The product' },
    { title: 'Made today', what: `A short clip or photo of it being made or prepared${A.special ? `, with "${A.special}" as the caption` : ''}.`, notice: 'The process' },
    { title: 'First reactions', what: 'Ask a customer what they think and post a photo with their one-line quote.', notice: 'The quote' }
  ];
  else if (type === 'service') list = [
    { title: 'Problem, then fix', what: `Start with the problem your customers have, in big text, then one line saying you fix it${A.book ? `, and "${A.book}" underneath` : ''}.`, notice: 'The problem you solve' },
    { title: 'Before and after', what: 'Two photos side by side: before and after your work. One short caption, no paragraphs.', notice: 'The difference' },
    { title: 'Book in one step', what: `Make how to book the biggest thing${A.book ? ` ("${A.book}")` : ''}, with your name and one line about what you do.`, notice: 'How to book' }
  ];
  else list = [
    { title: 'Meet the maker', what: 'A friendly portrait of you or your team with one sentence about why you do this.', notice: 'Your face' },
    { title: 'Why we started', what: 'A photo of where it all began with a short caption in your own words.', notice: 'The first line of your story' },
    { title: "Regulars' favourites", what: 'A post showing what regulars order most, with the name of each favourite.', notice: 'The favourite' }
  ];
  return list.map((x, i) => ({ ...x, tag: i === 0 ? 'Start here' : 'If you have time' }));
}

function whereFor(A) {
  const map = {
    'Instagram': 'Instagram: post idea 1 as a portrait image (1080 × 1350) and repeat the message as a story (1080 × 1920).',
    'WhatsApp': 'WhatsApp: send the image with a one-line caption to a broadcast list or your Status, and ask regulars to forward it.',
    'Facebook group': 'Local Facebook groups: share the same image and write the offer in the caption too. Check the group rules on promotion first.',
    'Shop window or poster': 'Shop window: print idea 1 at A4 or A3 and put the main message where eyes land at standing height.',
    'Word of mouth': 'Word of mouth: say it out loud at the till and put it on a small card with each receipt.'
  };
  return (A.channels || []).map(c => map[c]).filter(Boolean);
}

function freeTipsFor(A) {
  const has = x => (A.assets || []).includes(x);
  const tier = (A.budget || '').startsWith('Almost') ? 0 : (A.budget || '').startsWith('Some') ? 1 : 2;
  const tips = [];
  if (has('Phone photos') || has('Nothing yet') || !(A.assets || []).length)
    tips.push('Photos: use your phone next to a window in daylight, no flash, and wipe the lens first.');
  tips.push(has('A Canva account')
    ? 'Design: start from a blank 1080 × 1350 post in Canva and keep only the main message and your name.'
    : 'Design: Canva has a free plan with "Instagram Post" templates. Delete everything except the main message and your name.');
  tips.push('Fonts and colours: use only the ones in this brief. Everything is free on Google Fonts and Canva.');
  tips.push(tier === 0 ? 'Time: do only idea 1 this week. It takes about 15 minutes.'
    : tier === 1 ? 'Time: do ideas 1 and 2 this week and keep idea 3 for next week.'
    : 'Time: spread all three over a week, one post every two or three days.');
  if (tier > 0 && (A.channels || []).includes('Shop window or poster'))
    tips.push('Optional: print your window poster at a local print shop. It is usually a few pounds.');
  return tips;
}

function buildBrief(A) {
  const vibes = A.vibe && A.vibe.length ? A.vibe : ['Friendly'];
  const colours = [];
  vibes.slice(0, 2).forEach((v, i) => (PALETTES[v] || []).slice(0, i === 0 ? 3 : 2).forEach(c => { if (!colours.includes(c)) colours.push(c); }));
  const voice = [...new Set(vibes.slice(0, 2).map(v => VOICES[v]).filter(Boolean))].join(' ');
  const when = A.when && A.when !== 'No end date' ? A.when : '';
  let core = cap(A.offer || 'Your main message');
  if (A.offerType === 'offer' && when) core += ' · ' + when.toLowerCase();
  if (A.offerType === 'event' && A.when) core += ' · ' + A.when;
  if (A.offerType === 'product' && A.special) core += ' · ' + A.special;
  if (A.offerType === 'service' && A.book) core += ' · ' + A.book;
  return {
    core,
    notice: (A.offer || '').slice(0, 80),
    audience: cap(A.audience || 'Your regulars'),
    different: A.why ? cap(A.why) : '',
    tone: vibes.map(v => v.toLowerCase()).join(', '),
    voice,
    colours: colours.slice(0, 5),
    font: FONTS[vibes[0]] || FONTS.Friendly,
    photo: PHOTOS[vibes[0]] || PHOTOS.Friendly,
    ideas: ideasFor(A),
    where: whereFor(A),
    free: freeTipsFor(A)
  };
}

function briefToText(b) {
  const L = [];
  L.push('MY CREATIVE BRIEF', '', 'Core message: ' + b.core, 'Who it is for: ' + b.audience);
  if (b.different) L.push('What makes us different: ' + b.different);
  L.push('Tone: ' + b.tone + '. ' + b.voice, 'Colours: ' + b.colours.join(', '), 'Fonts: ' + b.font, 'Photos: ' + b.photo, '', 'POST IDEAS');
  b.ideas.forEach((x, i) => L.push(`${i + 1}. ${x.title} (${x.tag}): ${x.what} People should notice first: ${x.notice}.`));
  L.push('', 'WHERE TO POST'); b.where.forEach(w => L.push('- ' + w));
  L.push('', 'MAKE IT FOR FREE'); b.free.forEach(w => L.push('- ' + w));
  return L.join('\n');
}

/* =====================================================================
   2. THE QUESTIONS
   Each question: id, kind ('choice' | 'text' | 'multi'), text, options...
   after(value) runs once the person answers. It can add follow-up questions
   with insertNext(...). That is what makes the chat adapt to the replies.
   ===================================================================== */
const CHIPS_BY_GOAL = {
  'More people through the door': ['Weekend offer: ', 'New on the menu: ', 'Now open late on '],
  'More online orders': ['Free delivery on ', 'New product: ', 'Bundle deal: '],
  'Fill an event': ['Live music on ', 'Workshop on ', 'Grand opening on '],
  'Get known locally': ['Our story: ', 'Meet the team: ', 'Why we started: ']
};

function detailQs(type) {
  if (type === 'offer') return [{ id: 'when', kind: 'choice', text: 'When does it end?', options: ['This weekend', 'This week', 'This month', 'No end date'] }];
  if (type === 'event') return [{ id: 'when', kind: 'text', text: 'What day, time and place? One line is fine.', placeholder: 'e.g. Friday 8pm, 12 Elvet Bridge' }];
  if (type === 'product') return [{ id: 'special', kind: 'text', text: 'What makes it special, in your own words?', placeholder: 'e.g. baked fresh every morning' }];
  if (type === 'service') return [{ id: 'book', kind: 'text', text: 'How do people book you? Phone, website or just walk in?', placeholder: 'e.g. call 0191 123 4567' }];
  return [];
}

// "What kind of message is this?" with our guess already ticked, so one tap confirms it
const KINDS = { 'A deal or discount': 'offer', 'An event': 'event', 'Something new to buy': 'product', 'A service people can book': 'service', 'Our story, getting known': 'story' };

// Decides what to ask next about the main message.
async function resolveOffer(v, noMore) {
  A.offer = v.trim().replace(/[.!\s]+$/, '');
  const parts = splitIdeas(A.offer);
  if (parts.length) {                       // several messages in one reply -> ask them to pick one
    insertNext({
      id: 'offerPick', kind: 'choice',
      text: `That's ${parts.length} messages in one. People only remember one at a time. Which matters most this week?`,
      options: parts, after: c => resolveOffer(c, true)
    });
    return;
  }
  if (!noMore && words(A.offer).length < 3) { // too vague -> ask for detail
    const first = A.offer;
    insertNext({
      id: 'offerMore', kind: 'text',
      text: 'Can you add a detail? For example how much, which product, or which day.',
      placeholder: 'e.g. 50% off all pastries, Saturday and Sunday',
      after: d => resolveOffer(first + ' ' + d, true)
    });
    return;
  }
  const guess = classify(A.offer);           // offer / event / product / service / story
  insertNext({
    id: 'kind', kind: 'choice', text: 'What kind of message is this?', suggest: Object.keys(KINDS).find(k => KINDS[k] === guess),
    options: Object.keys(KINDS),
    after: v => { A.offerType = KINDS[v]; insertNext(...detailQs(A.offerType)); }
  });
}

const Q = {
  name: {
    id: 'name', kind: 'text',
    text: "First, what's your business called?",
    placeholder: 'e.g. Bloom Café'
  },
  goal: {
    id: 'goal', kind: 'choice',
    text: 'What would help your business most in the next month?',
    options: ['More people through the door', 'More online orders', 'Fill an event', 'Get known locally', 'Something else'],
    after: v => { if (v === 'Something else') insertNext({ id: 'goal', kind: 'text', text: 'No problem. In a few words, what would help most?', placeholder: 'e.g. more weekday lunch customers' }); }
  },
  offer: {
    id: 'offerRaw', kind: 'text',
    text: () => A.goal === 'Fill an event' ? "What's the event? Tell me in your own words." : "What's one thing you'd love people to know this week?",
    placeholder: 'e.g. 50% off pastries this weekend',
    chips: () => CHIPS_BY_GOAL[A.goal] || [],
    after: v => resolveOffer(v, false)
  },
  audience: {
    id: 'audience', kind: 'choice', allowText: true,
    text: 'Now think of your best customer. Who are they?',
    options: ['Students', 'Families', 'Local regulars', 'Young professionals', 'Tourists', 'Everyone'],
    after: v => {
      if (/\b(everyone|everybody|anyone|anybody|all)\b/i.test(v))
        insertNext({ id: 'audience', kind: 'text', text: '"Everyone" is hard to design for. Think of the last person who bought from you. Who were they?', placeholder: 'e.g. a student buying lunch between lectures' });
    }
  },
  why: {
    id: 'why', kind: 'choice', allowText: true,
    text: 'What do your regulars say they love about you?',
    options: ['Friendly service', 'Great prices', 'Handmade / homemade', 'Quality', 'Local and independent', 'Convenient']
  },
  vibe: {
    id: 'vibe', kind: 'multi', max: 3,
    text: 'Which words fit your business best? Pick up to three.',
    options: ['Cosy', 'Sleek', 'Playful', 'Serious', 'Handmade', 'Modern', 'Bold', 'Calm', 'Friendly', 'Premium']
  },
  assets: {
    id: 'assets', kind: 'multi', exclusive: 'Nothing yet',
    text: 'What do you already have to work with?',
    options: ['Phone photos', 'Product photos', 'A logo', 'A Canva account', 'Nothing yet'],
    after: v => { if (v.includes('Nothing yet')) say("That's fine. A phone and window light are enough, and I'll show you how."); }
  },
  budget: {
    id: 'budget', kind: 'choice',
    text: 'How much time and money can you spare?',
    options: ['Almost none: 30 minutes a week, £0', 'Some: 1–2 hours a week, under £20', 'More: I can invest time and a bit of money']
  },
  channels: {
    id: 'channels', kind: 'multi', exclusive: 'Not sure yet',
    text: 'Where do your customers already look?',
    options: ['Instagram', 'WhatsApp', 'Facebook group', 'Shop window or poster', 'Word of mouth', 'Not sure yet'],
    after: v => {
      if (v.includes('Not sure yet')) {
        A.channels = ['Instagram', 'Shop window or poster'];
        say("No problem. I'll start you with Instagram and a poster for your window.");
      }
    }
  }
};
const BASE = [Q.name, Q.goal, Q.offer, Q.audience, Q.why, Q.vibe, Q.assets, Q.budget, Q.channels];

/* =====================================================================
   3. ONE QUESTION PER SCREEN
   Big tap targets, plain words, a Back button, no chat. Most answers are a
   single tap; typing is only asked for when we really need their words.
   ===================================================================== */
const stage = document.getElementById('stage');
const logEl = stage;                       // the brief is drawn here at the end
const bar = document.getElementById('bar');
const topbar = document.getElementById('topbar'), backBtn = document.getElementById('backBtn'), stepTxt = document.getElementById('stepTxt');
let A = {}, queue = [], history = [], note = '';

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function insertNext(...qs) { queue.unshift(...qs); }
function say(text) { note = text; }                       // a friendly note shown on the next screen
function setBar(r) { bar.style.width = Math.round(r * 100) + '%'; }
const clone = o => JSON.parse(JSON.stringify(o));

function go() {
  if (!queue.length) return finish();
  show(queue.shift(), undefined);
}
let current = null;
async function answer(q, value) {
  history.push({ q, prev: value, A: clone(A), queue: [...queue], note });
  A[q.id] = value; note = '';
  if (q.after) await q.after(value);
  go();
}
function back() {
  const h = history.pop(); if (!h) return;
  A = h.A; queue = h.queue; note = h.note;
  show(h.q, h.prev);
}
backBtn.onclick = back;

function show(q, prev) {
  current = q;
  const n = history.length + 1, total = history.length + 1 + queue.length;
  topbar.hidden = false; backBtn.disabled = history.length === 0;
  stepTxt.textContent = `Question ${n} of ${Math.max(total, n)}`;
  setBar((n - 1) / Math.max(total, n));
  const card = el('section', 'card');
  if (note) card.appendChild(el('div', 'note', note));
  card.appendChild(el('h2', '', typeof q.text === 'function' ? q.text() : q.text));
  const sub = q.suggest ? 'We ticked our best guess. Tap it to confirm, or pick another.' : q.kind === 'multi' ? (q.max ? `Tap up to ${q.max}, then press Next.` : 'Tap all that fit, then press Next.')
            : q.kind === 'choice' ? 'Tap one.' : 'A few words is plenty.';
  card.appendChild(el('p', 'sub', sub));

  if (q.kind === 'choice') {
    const tiles = el('div', 'tiles');
    q.options.forEach(o => {
      const t = el('button', 'tile'); t.type = 'button';
      t.append(el('span', 'box'), el('span', '', o));
      if (prev === o || (prev === undefined && q.suggest === o)) { t.classList.add('on'); t.querySelector('.box').textContent = '✓'; }
      t.onclick = () => { tiles.querySelectorAll('.tile').forEach(x => x.classList.remove('on')); t.classList.add('on'); t.querySelector('.box').textContent = '✓'; setTimeout(() => answer(q, o), 260); };
      tiles.appendChild(t);
    });
    card.appendChild(tiles);
    if (q.allowText) {
      const more = el('button', 'linkish', 'None of these? Write your own'); more.type = 'button';
      const wrap = el('div'); wrap.hidden = true;
      more.onclick = () => { wrap.hidden = false; more.hidden = true; wrap.querySelector('input').focus(); };
      wrap.appendChild(textBlock(q, 'Type it here', prev && !q.options.includes(prev) ? prev : ''));
      const r = el('div', 'nextrow'); r.appendChild(more); card.append(r, wrap);
    }
  } else if (q.kind === 'text') {
    card.appendChild(textBlock(q, q.placeholder || 'Type here', typeof prev === 'string' ? prev : ''));
  } else if (q.kind === 'multi') {
    const picked = new Set(Array.isArray(prev) ? prev : []);
    const tiles = el('div', 'tiles'); const btns = {};
    const nextB = el('button', 'nextbtn', 'Next →'); nextB.type = 'button';
    const paint = () => { Object.entries(btns).forEach(([k, b]) => { const on = picked.has(k); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); b.querySelector('.box').textContent = on ? '✓' : ''; }); nextB.disabled = picked.size === 0; };
    q.options.forEach(o => {
      const t = el('button', 'tile multi'); t.type = 'button'; t.append(el('span', 'box'), el('span', '', o)); btns[o] = t;
      t.onclick = () => {
        if (picked.has(o)) picked.delete(o);
        else {
          if (q.exclusive) { if (o === q.exclusive) picked.clear(); else picked.delete(q.exclusive); }
          if (q.max && picked.size >= q.max && o !== q.exclusive) return;
          picked.add(o);
        }
        paint();
      };
      tiles.appendChild(t);
    });
    nextB.onclick = () => answer(q, [...picked]);
    const r = el('div', 'nextrow'); r.appendChild(nextB);
    card.append(tiles, r); paint();
  }
  stage.replaceChildren(card);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function textBlock(q, placeholder, value) {
  const f = el('form');
  const i = el('input', 'bigin'); i.type = 'text'; i.placeholder = placeholder; i.maxLength = 200; i.value = value || ''; i.setAttribute('aria-label', 'Your answer');
  f.appendChild(i);
  const sug = q.chips ? q.chips() : [];
  if (sug.length) {
    const row = el('div', 'starters');
    sug.forEach(s => { const b = el('button', 'chip soft', s.trim().replace(/[:]$/, '') + '…'); b.type = 'button'; b.onclick = () => { i.value = s; i.focus(); i.setSelectionRange(s.length, s.length); check(); }; row.appendChild(b); });
    f.append(el('div', 'hint', 'Stuck? Tap one to start, then finish the sentence:'), row);
  }
  const r = el('div', 'nextrow'); const nb = el('button', 'nextbtn', 'Next →'); nb.type = 'submit'; r.appendChild(nb); f.appendChild(r);
  const check = () => { nb.disabled = !i.value.trim(); };
  i.oninput = check; check();
  f.onsubmit = e => { e.preventDefault(); const v = i.value.trim(); if (v) answer(q, v); };
  setTimeout(() => { if (window.matchMedia('(pointer: fine)').matches) i.focus(); }, 50);
  return f;
}


/* =====================================================================
   5. POSTER DRAFTS: draw 3 real layouts from the brief, using composition
   rules, so the owner gets a design proposal, not just advice.
   ===================================================================== */
const POSTER_FONTS = { Playful: 'Poppins', Bold: 'Poppins', Friendly: 'Poppins', Sleek: 'Montserrat', Modern: 'Montserrat', Premium: 'Montserrat', Cosy: 'Fraunces', Handmade: 'Fraunces', Serious: 'Fraunces', Calm: 'Montserrat' };
const lum = hex => { const n = parseInt(hex.slice(1), 16); const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; };
const sat = hex => { const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b); return mx ? (mx - mn) / mx : 0; };
const ratio = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };

function posterColours(cols) {
  const accent = [...cols].sort((a, b) => sat(b) - sat(a))[0] || '#AD2831';
  const rest = cols.filter(c => c !== accent);
  const lightest = [...cols].sort((a, b) => lum(b) - lum(a))[0];
  const darkest = [...rest].sort((a, b) => lum(a) - lum(b))[0];
  const light = lightest && lum(lightest) > 0.55 ? lightest : '#FFFBF4';    // the brief's own cream if it has one
  const dark = darkest && lum(darkest) < 0.06 ? darkest : '#1A1214';
  const on = bg => ratio(bg, dark) >= ratio(bg, light) ? dark : light;   // the most readable text colour
  return { light, dark, accent, on };
}
// fit text into a box: biggest size that fits in up to maxLines lines
function fitText(ctx, text, font, weight, maxW, maxH, maxLines, maxSize) {
  for (let size = maxSize; size >= 18; size -= 4) {
    ctx.font = `${weight} ${size}px "${font}"`;
    const wordsArr = text.split(/\s+/), lines = []; let line = '';
    for (const w of wordsArr) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width <= maxW) line = t; else { if (line) lines.push(line); line = w; } }
    if (line) lines.push(line);
    const lh = size * 1.08;
    if (lines.length <= maxLines && lines.every(l => ctx.measureText(l).width <= maxW) && lines.length * lh <= maxH) return { size, lines, lh };
  }
  ctx.font = `${weight} 18px "${font}"`; return { size: 18, lines: [text], lh: 20 };
}
function drawLines(ctx, fit, x, y, align) { ctx.textAlign = align; ctx.textBaseline = 'top'; fit.lines.forEach((l, i) => ctx.fillText(l, x, y + i * fit.lh)); return y + fit.lines.length * fit.lh; }
function photoSpot(ctx, x, y, w, h, col) {
  ctx.save(); ctx.strokeStyle = col; ctx.globalAlpha = 0.55; ctx.lineWidth = 4; ctx.setLineDash([18, 12]);
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 28); ctx.stroke(); ctx.setLineDash([]);
  ctx.font = '600 44px Inter'; ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('Your photo here', x + w / 2, y + h / 2); ctx.restore();
}

async function makeDrafts(A, b) {
  const font = POSTER_FONTS[(A.vibe || [])[0]] || 'Poppins';
  try { await Promise.all([document.fonts.load(`800 60px "${font}"`), document.fonts.load('600 30px Inter')]); } catch (e) {}
  const C = posterColours(b.colours.length ? b.colours : ['#FD9BB7', '#640D14', '#F3E6BD']);
  const msg = cap(A.offer || 'Your main message');
  const extra = A.offerType === 'offer' && A.when && A.when !== 'No end date' ? A.when : A.offerType === 'event' ? (A.when || '') : A.offerType === 'product' ? (A.special || '') : A.offerType === 'service' ? (A.book || '') : '';
  const name = (A.name || 'Your business').toUpperCase();
  const W = 1080, H = 1350, out = [];

  // 1) Message first: the offer fills the top third, so it's the first thing seen
  {
    const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
    x.fillStyle = C.light; x.fillRect(0, 0, W, H);
    x.fillStyle = C.accent; x.fillRect(0, 0, W, 560);
    x.fillStyle = C.on(C.accent); const f = fitText(x, msg, font, 800, W - 160, 360, 3, 150);
    const y0 = 80 + (360 - f.lines.length * f.lh) / 2, end = drawLines(x, f, 80, y0, 'left');
    if (extra) { x.font = `600 60px "${font}"`; x.fillText(extra, 80, Math.min(end + 24, 470)); }
    photoSpot(x, 80, 620, W - 160, 520, C.on(C.light));
    x.fillStyle = C.on(C.light); x.font = '800 48px Inter'; x.textAlign = 'left'; x.textBaseline = 'alphabetic'; x.fillText(name, 80, H - 80);
    out.push({ c, title: 'Message first', why: 'Your message takes the top third in a bold colour block. People read top-down, so it is seen first.', target: { x: 50, y: 21 } });
  }
  // 2) Centre stage: one big circle in the middle = one clear focal point
  {
    const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
    x.fillStyle = C.dark; x.fillRect(0, 0, W, H);
    x.fillStyle = C.accent; x.beginPath(); x.arc(W / 2, H * 0.47, 430, 0, Math.PI * 2); x.fill();
    x.fillStyle = C.on(C.accent); const f = fitText(x, msg, font, 800, 640, 420, 4, 130);
    const end = drawLines(x, f, W / 2, H * 0.47 - f.lines.length * f.lh / 2 - (extra ? 30 : 0), 'center');
    if (extra) { x.font = `600 56px "${font}"`; x.fillText(extra, W / 2, end + 18); }
    x.fillStyle = C.on(C.dark); x.font = '800 48px Inter'; x.textAlign = 'center'; x.textBaseline = 'alphabetic'; x.fillText(name, W / 2, H - 90);
    out.push({ c, title: 'Centre stage', why: 'Eyes land near the middle first. One big circle there makes your message the only focal point.', target: { x: 50, y: 47 } });
  }
  // 3) Rule of thirds: message on the left third line, photo on the right, name bottom
  {
    const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
    x.fillStyle = C.light; x.fillRect(0, 0, W, H);
    photoSpot(x, 600, 80, 400, H - 260, C.on(C.light));
    x.fillStyle = C.accent; x.fillRect(80, 380, 16, 420);
    x.fillStyle = C.on(C.light); const f = fitText(x, msg, font, 800, 460, 420, 5, 110);
    const end = drawLines(x, f, 130, 380, 'left');
    if (extra) { x.fillStyle = C.accent; x.font = `700 54px "${font}"`; x.fillText(extra, 130, end + 22); }
    x.fillStyle = C.on(C.light); x.font = '800 48px Inter'; x.textAlign = 'left'; x.textBaseline = 'alphabetic'; x.fillText(name, 80, H - 80);
    out.push({ c, title: 'Rule of thirds', why: 'The message sits on the left third line, where designers put key points. The photo balances the right.', target: { x: 25, y: 38 } });
  }
  return out;
}

function draftsSection(A, b) {
  const wrap = el('div', 'drafts');
  makeDrafts(A, b).then(list => list.forEach(d => {
    const box = el('div', 'draft');
    box.append(d.c, el('b', '', d.title), el('div', 'why', d.why));
    const btns = el('div', 'btns');
    const check = el('a', '', 'Check with Saccade →'); check.href = './?draft#try';
    check.onclick = () => {
      try { sessionStorage.setItem('saccade:draft', JSON.stringify({ img: d.c.toDataURL('image/jpeg', 0.9), goal: (A.offer || '').slice(0, 60), x: d.target.x, y: d.target.y })); } catch (e) {}
    };
    const dl = el('button', '', 'Download'); dl.type = 'button';
    dl.onclick = () => { const a = document.createElement('a'); a.download = 'poster-' + d.title.toLowerCase().replace(/\s+/g, '-') + '.png'; a.href = d.c.toDataURL('image/png'); a.click(); };
    btns.append(check, dl); box.appendChild(btns); wrap.appendChild(box);
  }));
  return wrap;
}

/* =====================================================================
   4. SHOWING THE BRIEF
   ===================================================================== */
function textOn(hex) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#120709' : '#F7EEDC';
}
function section(card, title, node) { card.append(el('h3', '', title), node); }
function list(items) { const u = el('ul'); items.forEach(t => u.appendChild(el('li', '', t))); return u; }

function renderBrief(b) {
  const card = el('div', 'brief');
  card.appendChild(el('h2', '', 'Your creative brief'));

  const core = el('div', 'core'); core.appendChild(el('mark', '', b.core));
  section(card, 'What people should notice first', core);
  section(card, 'Your poster drafts', draftsSection(A, b));
  card.lastChild.before(el('div', 'notice', 'Three layouts made from your answers. Add your own photo, or check one straight away to see where eyes will go.'));
  section(card, 'Who it is for', el('div', '', b.audience + (b.different ? '. What makes you different: ' + b.different.toLowerCase() + '.' : '')));
  section(card, 'How it should sound', el('div', '', 'Tone: ' + b.tone + '. ' + b.voice));

  const look = el('div');
  const sw = el('div', 'swatches');
  b.colours.forEach(c => { const s = el('div', 'sw', c); s.style.background = c; s.style.color = textOn(c); sw.appendChild(s); });
  look.append(sw, el('div', '', 'Fonts: ' + b.font), el('div', '', 'Photos: ' + b.photo));
  section(card, 'Look and feel', look);

  const ideas = el('div', 'ideas');
  b.ideas.forEach((x, i) => {
    const d = el('div', 'idea');
    const t = el('b', '', (i + 1) + '. ' + x.title);
    t.appendChild(el('span', 'tag' + (i ? ' later' : ''), x.tag));
    d.append(t, el('div', '', x.what), el('div', 'notice', 'People should notice first: ' + x.notice));
    ideas.appendChild(d);
  });
  section(card, 'Three posts you can make', ideas);
  if (b.where.length) section(card, 'Where to post', list(b.where));
  section(card, 'Make it for free', list(b.free));

  const actions = el('div', 'actions');
  const check = el('a', 'primary', 'Check my post with Saccade →');
  check.href = './?notice=' + encodeURIComponent(b.notice) + '#try';
  const copy = el('button', 'secondary', 'Copy this brief'); copy.type = 'button';
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(briefToText(b)); copy.textContent = 'Copied ✓'; }
    catch (e) { copy.textContent = 'Could not copy'; }
  };
  const again = el('button', 'secondary', 'Start again'); again.type = 'button';
  again.onclick = start;
  actions.append(check, copy, again);
  card.appendChild(actions);

  logEl.appendChild(card);
  card.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function finish() {
  setBar(1); topbar.hidden = true;
  stage.replaceChildren();
  renderBrief(buildBrief(A));
}

function start() {
  A = {}; queue = [...BASE]; history = []; note = '';
  topbar.hidden = true; setBar(0);
  const card = el('section', 'card welcome');
  card.append(el('h2', '', "Let's work out your message, then we'll draw your poster."));
  const ul = el('ul');
  ['About 10 questions, mostly one tap each', 'No design skills needed', 'Nothing to pay, nothing to sign up for', 'You can go back and change an answer any time']
    .forEach(t => ul.appendChild(el('li', '', t)));
  const r = el('div', 'nextrow'); const b = el('button', 'nextbtn', "Let's start →"); b.type = 'button'; b.onclick = go; r.appendChild(b);
  card.append(ul, r);
  stage.replaceChildren(card);
}
if (typeof document !== 'undefined' && !window.__NO_AUTOSTART) start();
</script>
